name: IndexNow ping

# Vercel reports each deployment to GitHub; ping IndexNow once a production
# deployment succeeds so Bing re-crawls the indexable URLs.
on: deployment_status

jobs:
  ping:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      # Node 24 runs the script's direct .ts imports without a loader.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/indexnow.mjs
